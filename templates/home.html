<!doctype html>
<html lang="ko">
<head>
    <title>봉식이네 주식 추천소</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">

<!-- CSS에 사용 -->
    <style>
    body {
        font-family: 'Do Hyeon', sans-serif;
    }
    .nav-tabs .nav-link {
        padding: 1rem 2.5rem;   /* 상하 1rem, 좌우 2.5rem로 넓게 */
        font-size: 1.2rem;      /* 글씨도 약간 키움 */
        border-radius: 0.75rem 0.75rem 0 0; /* 둥글게(선택) */
    }
    .nav-tabs {
        margin-bottom: 1rem;
    }

    </style>
</head>
<body>
<div class="container">
    <h1 class="mb-4 display-5 text-center rounded p-3">📈 봉식이네 주식 추천소</h1>
    <ul class="nav nav-tabs">
        <li class="nav-item"><a class="nav-link {{'active' if tab=='home' else ''}}" href="/?tab=home">홈</a></li>
        <li class="nav-item"><a class="nav-link {{'active' if tab=='stock' else ''}}" href="/index?tab=stock&subtab=company">주식</a></li>
        <li class="nav-item"><a class="nav-link {{'active' if tab=='news' else ''}}" href="/news">뉴스</a></li>
        <li class="nav-item"><a class="nav-link {{'active' if tab=='info' else ''}}" href="/info?tab=info&subtab=거래일 정보">데이터</a></li>
        <li class="nav-item"><a class="nav-link {{'active' if tab=='support' else ''}}" href="/support?tab=support">고객센터</a></li>
    </ul>
    {% if tab == 'home' %}
        <h2>📊 인공지능 기반 주식 추천 서비스</h2>
        <p>봉식이 AI가 시장 데이터를 분석해 매일 추천 종목을 알려드려요!</p>
    {% endif %}
</div>
</body>
</html>
