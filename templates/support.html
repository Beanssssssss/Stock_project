<!doctype html>
<html lang="ko">
<head>
    <title>봉식이네</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">

<!-- CSS에 사용 -->
    <style>
    body {
        font-family: 'Do Hyeon', sans-serif;
    }
    .nav-tabs .nav-link {
    padding: 1rem 2.5rem;
    font-size: 1.2rem;
    border-radius: 0.75rem 0.75rem 0 0;
    color: hotpink !important;
    }
    .nav-tabs {
        margin-bottom: 1rem;
    }
    .nav-tabs .nav-link.active {
        background-color: #fff;
        border-color: #dee2e6 #dee2e6 #fff;
        color: deeppink !important;
    }

    /* 🔻 서브탭 (nav-pills) 색상 조정 */
    .nav-pills .nav-link {
        color: hotpink !important;
    }
    .nav-pills .nav-link.active {
        background-color: #fff;
        color: deeppink !important;
        border: 1px solid deeppink;
    }

    </style>
</head>
<body>
<div style="position: fixed; top: 10px; left: 10px; z-index: 9999;">
        <img src="{{ url_for('static', filename='img/club_logo2.png') }}"
             alt="Banner"
             style="height: 80px;">
</div>
<div class="container">
    <h1 class="mb-4 display-5 text-center rounded p-3">📈 BONG'S TALK</h1>
        <ul class="nav nav-tabs">
            <li class="nav-item"><a class="nav-link {{ 'active' if tab == 'home' else '' }}" href="/home?tab=home">홈</a></li>
            <li class="nav-item"><a class="nav-link {{ 'active' if tab == 'stock' else '' }}" href="/index?tab=stock">주식</a></li>
            <li class="nav-item"><a class="nav-link {{ 'active' if tab == 'news' else '' }}" href="/news?tab=news">뉴스</a></li>
            <li class="nav-item"><a class="nav-link {{ 'active' if tab == 'info' else '' }}" href="/info?tab=info">데이터</a></li>
            <li class="nav-item"><a class="nav-link {{ 'active' if tab == 'support' else '' }}" href="/support?tab=support">고객센터</a></li>
        </ul>
</div>

<div class="container mt-4">
    <h2>📞 고객센터</h2>
    <!-- 🔻 고객센터 서브탭 -->
    <ul class="nav nav-pills mb-3">
        <li class="nav-item">
            <a class="nav-link {{ 'active' if support_tab == '자주 묻는 질문' else '' }}" href="/support?support_tab=자주 묻는 질문">자주 묻는 질문</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {{ 'active' if support_tab == '문의하기' else '' }}" href="/support?support_tab=문의하기">문의하기</a>
        </li>
    </ul>

    <!-- 🧾 FAQ 탭 내용 -->
    {% if support_tab == '자주 묻는 질문' %}
    <div class="accordion" id="faqAccordion">
        <div class="card">
            <div class="card-header" id="q1">
                <h5 class="mb-0">
                    <button class="btn btn-link" data-toggle="collapse" data-target="#a1" aria-expanded="true" aria-controls="a1">
                        Q. 주가 예측은 어떤 기준으로 하나요?
                    </button>
                </h5>
            </div>
            <div id="a1" class="collapse show" aria-labelledby="q1" data-parent="#faqAccordion">
                <div class="card-body">
                    인공지능 모델이 과거 주가 데이터와 뉴스 감성 분석을 종합하여 상승 확률을 예측합니다.
                </div>
            </div>
        </div>
        <!-- 추가 질문 카드들 여기에 -->
    </div>
    {% endif %}

    <!-- 📨 문의하기 탭 내용 -->
    {% if support_tab == '문의하기' %}
        <form>
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" class="form-control" id="email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label for="message">문의 내용</label>
                <textarea class="form-control" id="message" rows="4"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">보내기</button>
        </form>
    {% endif %}
</div>
</div>
</div>
</body>
</html>
