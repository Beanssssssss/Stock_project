<!doctype html>
<html lang="ko">
<head>
    <title>봉식이네 주식 추천소</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">

<!-- CSS에 사용 -->
    <style>
    body {
        font-family: 'Do Hyeon', sans-serif;
    }
    .nav-tabs .nav-link {
        padding: 1rem 2.5rem;   /* 상하 1rem, 좌우 2.5rem로 넓게 */
        font-size: 1.2rem;      /* 글씨도 약간 키움 */
        border-radius: 0.75rem 0.75rem 0 0; /* 둥글게(선택) */
    }
    .nav-tabs {
        margin-bottom: 1rem;
    }

    </style>
</head>
<body>
<div class="container">
    <h1 class="mb-4 display-5 text-center rounded p-3">📈 봉식이네 주식 추천소</h1>
    <ul class="nav nav-tabs">
        <li class="nav-item"><a class="nav-link {{'active' if tab=='home' else ''}}" href="/home?tab=home">홈</a></li>
        <li class="nav-item"><a class="nav-link {{'active' if tab=='stock' else ''}}" href="/index?tab=stock&subtab=company">주식</a></li>
        <li class="nav-item"><a class="nav-link {{'active' if tab=='news' else ''}}" href="/news">뉴스</a></li>
        <li class="nav-item"><a class="nav-link {{'active' if tab=='info' else ''}}" href="/info?tab=info&subtab="거래일 정보">데이터</a></li>
        <li class="nav-item"><a class="nav-link {{'active' if tab=='support' else ''}}" href="/support">고객센터</a></li>
    </ul>
    <div class="mt-4">
    <h2 class="mt-4 mb-3">종목별 뉴스 조회</h2>
    <form method="get" action="/news" class="form-inline mb-3">
        <select name="company" class="form-control mr-2">
            {% for company in companies %}
            <option value="{{ company }}" {% if company == selected_company %}selected{% endif %}>{{ company }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-primary">조회</button>
    </form>

    {% if news is not none and not news.empty %}
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>제목</th>
                <th>본문</th>
                <th>날짜</th>
                <th>링크</th>
            </tr>
        </thead>
        <tbody>
            {% for idx, row in news.iterrows() %}
            <tr>
                <td>{{ row['제목'] }}</td>
                <td>{{ row['본문'] }}</td>
                <td>{{ row['날짜'] }}</td>
                <td>{{ row['URL'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
        <p>해당 종목의 뉴스가 없습니다.</p>
    {% endif %}
</div>
</body>
</html>
